    utilizzabile. Occorre validare i valori ammessi e la loro lunghezza. Il
    conflitto per kid già presente maschera il controllo della lunghezza; la
    verifica richiede una chiave nuova e un'esecuzione isolata. Il difetto è
    tracciato in PIN-11053.
