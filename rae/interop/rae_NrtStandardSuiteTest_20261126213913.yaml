  procedure: |
    Rieseguire in locale ESERVICE_ARCHIVING_GRACE_PERIOD_1.2 e consultare lo
    stack trace. Confrontare il testo atteso per ARCHIVING_BEFORE_DESCRIPTOR
    con quello rilevato da WebEServiceGateway.assertArchivingRejection.
    Durante la riesecuzione, verificare che la richiesta di archiviazione
    del delegato venga rifiutata. Confrontare la snackbar mostrata a video
    con il design Figma e verificare se il messaggio indica il motivo del
    rifiuto e l'azione da intraprendere.
  result: |
    Il sistema rifiuta correttamente la richiesta del delegato con 60 giorni
    di preavviso, perché l'archiviazione dell'e-service precederebbe quella
    di una versione già pianificata con 120 giorni di preavviso. Da Figma ci
    si aspetta il messaggio «Non puoi archiviare l’e-service prima di una
    versione già in fase di archiviazione. Seleziona una durata più lunga.»
    La snackbar mostra invece «Non è stato possibile richiedere
    l’archiviazione di questo e-service. Riprova più tardi.», seguito dalle
    istruzioni per contattare l'assistenza e da un identificativo. Al
    delegato viene quindi suggerito di riprovare più tardi, mentre per
    procedere deve selezionare un preavviso più lungo. Il test confronta il
    testo rilevato nella snackbar con quello atteso tramite un'asserzione di
    uguaglianza. Il confronto fallisce già sul messaggio principale, che è
    diverso da quello previsto.
