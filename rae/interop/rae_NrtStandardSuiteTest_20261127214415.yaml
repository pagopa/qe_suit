    La suite attende HTTP 400. Il BFF restituisce HTTP 200 e riporta il
    valore suggerito con tutti e tre gli spazi. L'asserzione fallisce per la
    differenza tra lo status atteso e quello effettivo. Il 200 è coerente
    con il contratto OpenAPI attuale, che impone una lunghezza da 1 a 250
    caratteri per valore suggerito. Il problema di prodotto è che si può
    configurare un suggerimento privo di contenuto utile. L'atteso proposto
    è rifiutare con HTTP 400 i valori composti solo da spazi e aggiornare il
    contratto OpenAPI. La resa nel portale resta da verificare.
