  result: |
    La suite legge @Nullable sul campo annotation della classe Java
    autogenerata e deduce che anche "annotation": null sia valido nel JSON.
    Per questo classifica la mutazione come INFERRED_VALID e attende HTTP
    200. Nel modello Java, null può rappresentare un campo omesso. Il
    contratto OpenAPI consente di omettere annotation, ma se il campo è
    presente richiede un oggetto. Il BFF riceve un null esplicito e
    restituisce correttamente HTTP 400. Il test fallisce perché attende 200.
    Per questa mutazione, la suite deve ricavare l'aspettativa dallo schema
    OpenAPI e attendere HTTP 400.
