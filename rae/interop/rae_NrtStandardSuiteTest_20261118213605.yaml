      assente, mentre l'atteso è che sia visibile e disabilitato. La stessa
      assenza è stata osservata nella verifica manuale e spiega il KO della
      suite durante il controllo dello stato del pulsante. Sulla stessa
      richiesta il pulsante è poi comparso disabilitato e successivamente si è
      abilitato. La causa dell'assenza iniziale resta da accertare.
