    procedure: |
      Rieseguire in locale su QA PRIVATE_CATALOG_ORDERING_PAGINATION_2 per
      l'esempio in KO, con un breakpoint all'inizio dell'hook After, prima che
      il teardown archivi o elimini gli e-service. Con l'esecuzione in pausa,
      consultare i log della riesecuzione e risalire ai nomi dei tre e-service
      a partire dagli ID riportati nell'asserzione. Confrontare il loro ordine
      relativo con quello atteso per il criterio selezionato. Mantenere
      l'esecuzione in pausa e ripetere da frontend la ricerca del Gherkin nel
      catalogo autenticato come PagoPA. Cercare «Sorte», filtrare per
      erogatore «Comune di Milano» e selezionare lo stesso ordinamento
      dell'esempio in KO. Scorrere tutte le pagine e verificare l'ordine
      relativo dei tre e-service identificati nei log. Ripetere la ricerca con
      gli stessi dati, filtri e ordinamento per verificare se la sequenza
      resta stabile.
    result: |
      Nel KO analizzato sono presenti tutti e tre gli e-service attesi, ma il
      loro ordine relativo è diverso da quello previsto. La ri-esecuzione ha
      restituito una sequenza diversa da quella del KO iniziale. In QA il
      disallineamento è stato osservato per tutti e quattro i criteri
      espliciti di ordinamento per nome e data di creazione, sia crescente sia
      decrescente. L'ordine relativo deve rispettare il criterio selezionato
      sull'insieme dei risultati paginati e restare stabile a parità di dati,
      filtri e criterio. La causa tecnica resta da accertare.
    link_prod_bug: https://pagopa.atlassian.net/browse/PIN-11313
    link_suite_bug: ''
