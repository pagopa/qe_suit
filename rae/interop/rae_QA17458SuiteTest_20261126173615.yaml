  procedure: >-
    Dal report Cucumber è stato verificato che tutti gli step di preparazione,
    compresa la richiesta di fruizione attiva, fossero stati superati e che il
    fallimento riguardasse soltanto l'assert finale. Nei log HTTP è stato poi
    verificato che l'e-service fosse effettivamente in modalità RECEIVE e che la
    richiesta di creazione della finalità fosse corretta. In debug è stato
    confermato che, al momento dell'assert, lo status ricevuto era 200. Dalla
    lettura della finalità restituita è emerso che il sistema l'aveva creata,
    quindi il KO è dovuto a un comportamento errato del prodotto e non della suite.
  result: >-
    L'API ha restituito HTTP 200 anziché HTTP 400 e ha creato una finalità in
    bozza associata a un e-service in modalità RECEIVE, operazione che avrebbe
