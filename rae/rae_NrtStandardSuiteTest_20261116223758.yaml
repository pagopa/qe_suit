    procedure: |
      Rieseguire in locale PRIVATE_CATALOG_TEXT_SEARCH_6 in debug e
      sospendere l'esecuzione prima che l'hook After archivi o elimini
      l'e-service. Dai log della ri-esecuzione, risalire dall'ID atteso
      di ES-1 al nome effettivamente pubblicato e verificare quale
      suffisso ha aggiunto la suite al nome definito nel Gherkin.

      Con l'e-service ancora disponibile, ripetere nel catalogo autenticato
      la ricerca dello scenario usando lo stesso termine con refuso e gli
      stessi eventuali filtri. Ripetere la ricerca con il nome effettivo
      completo, suffisso incluso, per verificare se ES-1 è reperibile.
      Confrontare entrambi gli esiti con il timeout registrato nei log.

    result: |
      La ricerca con refuso non restituisce ES-1 entro i 30 secondi di
      polling. La suite aggiunge al nome definito nello scenario un suffisso
      pseudocasuale per evitare collisioni tra esecuzioni parallele.
      Il suffisso riduce la similarità tra il termine cercato e il nome
      effettivamente pubblicato, alterando la verifica della ricerca
      approssimata. Il KO è attribuito alla preparazione dei dati di test.

      Approfondimento su Slack
      https://pagopaspa.slack.com/archives/C0AHSHU477D/p1793179880736759?thread_ts=1793106020.071549&cid=C0AHSHU477D
