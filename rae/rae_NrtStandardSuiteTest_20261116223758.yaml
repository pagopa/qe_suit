  - id_test: '[ESERVICE_ARCHIVING_GRACE_PERIOD_1.1] - Impossibilità di archiviare un e-service prima di una sua versione
      [Given=BFF,When=WEB,Then=WEB]'
    error_log: |
      org.opentest4j.AssertionFailedError: [EService archiving rejection: ARCHIVING_BEFORE_DESCRIPTOR] 
      expected: 
        "Non puoi archiviare l’e-service prima di una versione già in fase di archiviazione. Seleziona una durata più lunga."
       but was: 
        "Non puoi archiviare l’e-service prima di una versione già in fase di archiviazione. Seleziona una durata più lunga.
        Se l'errore persiste, apri una richiesta all'assistenza. Inserisci le informazioni di contesto e il codice riportato sotto.
        Identificativo"
          at it.pagopa.interop.web.eservice.infrastructure.WebEServiceGateway.assertArchivingRejection(WebEServiceGateway.java:133)
          at it.pagopa.interop.web.eservice.infrastructure.WebEServiceGateway.shouldFailToArchiveEService(WebEServiceGateway.java:77)
          at java.base/jdk.internal.reflect.NativeMethodAccessorImpl.invoke0(Native Method)
          at java.base/jdk.internal.reflect.NativeMethodAccessorImpl.invoke(NativeMethodAccessorImpl.java:77)
          at java.base/jdk.internal.reflect.DelegatingMethodAccessorImpl.invoke(DelegatingMethodAccessorImpl.java:43)
          at java.base/java.lang.reflect.Method.invoke(Method.java:569)
          at it.pagopa.infrastructure.channel.ChannelRouter.invoke(ChannelRouter.java:43)
          at it.pagopa.interop.common.infrastructure.ChannelRoutingInterceptor.invoke(ChannelRoutingInterceptor.java:40)
          at org.springframework.aop.framework.ReflectiveMethodInvocation.proceed(ReflectiveMethodInvocation.java:179)
          at org.springframework.aop.framework.JdkDynamicAopProxy.invoke(JdkDynamicAopProxy.java:222)
          at jdk.proxy2/jdk.proxy2.$Proxy157.shouldFailToArchiveEService(Unknown Source)
          at it.pagopa.interop.common.eservice.application.EServiceUseCase.shouldFailToArchiveEService(EServiceUseCase.java:43)
          at it.pagopa.interop.common.eservice.infrastructure.cucumber.EServiceSteps.rejectEServiceArchiving(EServiceSteps.java:62)
          at ✽.il sistema rifiuta l'archiviazione dell'e-service da parte dell'erogatore con un periodo di preavviso di 60 giorni e una motivazione valida(classpath:feature-expanded/eservice/archive-eservice.feature:20)
    procedure: |
      Rieseguire in locale ESERVICE_ARCHIVING_GRACE_PERIOD_1.1. Consultare lo
      stack trace e confrontare il testo atteso con quello rilevato da
      WebEServiceGateway.assertArchivingRejection per il caso
      ARCHIVING_BEFORE_DESCRIPTOR. Durante la riesecuzione, verificare che
      l'archiviazione venga rifiutata e confrontare il contenuto della
      snackbar mostrata a video con il design Figma di riferimento.
      Individuare le parti del messaggio visualizzato che differiscono dal
      design.
    result: |
      Il rifiuto dell'archiviazione è corretto. L'e-service non può essere
      archiviato con 60 giorni di preavviso perché una sua versione è già in
      fase di archiviazione con 120 giorni di preavviso. Atteso da Figma: la
      snackbar mostra solo il messaggio «Non puoi archiviare l’e-service prima
      di una versione già in fase di archiviazione. Seleziona una durata più
      lunga.» Osservato nella UI: la snackbar mostra il messaggio atteso,
      seguito dalle istruzioni per contattare l'assistenza e da un
      identificativo copiabile. Il test confronta il testo rilevato nella
      snackbar con il messaggio atteso tramite un'asserzione di uguaglianza.
      Il testo aggiuntivo rende le due stringhe diverse e fa fallire il test.
    link_prod_bug: https://pagopa.atlassian.net/browse/PIN-11178
    link_suite_bug: ''

