cucumber.execution.parallel.enabled=true
cucumber.execution.parallel.config.strategy=dynamic

# Usa la strategia fixed per ammortizzare le istanze del Browser in parallelo
#cucumber.execution.parallel.config.strategy=fixed
#cucumber.execution.parallel.config.fixed.parallelism=4

# Registra automaticamente le extension dichiarate via ServiceLoader
# (vedi common: META-INF/services/org.junit.jupiter.api.extension.Extension).
# Serve a popolare l'MDC dei test JUnit senza annotare ogni classe di test.
junit.jupiter.extensions.autodetection.enabled=true

# Reporting JUnit Platform: il report dei contratti legge il formato open-xml.
junit.platform.reporting.open.xml.enabled=true
junit.platform.reporting.output.dir=target/junit-platform-reports
junit.platform.output.capture.stdout=true
junit.platform.output.capture.stderr=true

# Il parallelismo di JUnit Jupiter NON si abilita qui: lo dichiara la suite che lo vuole, via
# @ConfigurationParameters (vedi BffRoleAuthorizationTest). Abilitarlo globalmente lo imporrebbe
# anche ai test unitari, e quelli che impostano il profilo via system property (globale alla JVM)
# si sovrascriverebbero a vicenda.
