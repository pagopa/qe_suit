# ============================================================================
# Test Profile Configuration
# ============================================================================
# Imports bearer tokens and test-specific settings for E2E tests
# ============================================================================

# ============================================================================
# External Configuration Import
# Loads bearer tokens for test environment from external properties file
# ============================================================================
spring:
  config:
    activate:
      on-profile: test
    import:
      - optional:classpath:secrets/bearer-token-test.properties
      - classpath:users/application-users-test.yaml

# ============================================================================
# URLs Configuration
# Base URLs and routes for test environment
# ============================================================================
url:
  notifiche:
    cittadino:
      base: https://cittadini.test.notifichedigitali.it
      notifiche: ${url.notifiche.cittadino.base}/notifiche
      notifiche-dettaglio: ${url.notifiche.cittadino.base}/notifiche/${iun}/dettaglio
      notifiche-dettaglio-timeline: ${url.notifiche.cittadino.base}/notifiche/${iun}/dettaglio/timeline
      recapiti: ${url.notifiche.cittadino.base}/recapiti
      recapiti-domicilio-digitale-attivazione: ${url.notifiche.cittadino.base}/recapiti/domicilio-digitale/attivazione
      recapiti-domicilio-digitale-gestione: ${url.notifiche.cittadino.base}/recapiti/domicilio-digitale/gestione
      deleghe: ${url.notifiche.cittadino.base}/deleghe
      add-deleghe: ${url.notifiche.cittadino.base}/deleghe/nuova
      app-status: ${url.notifiche.cittadino.base}/app-status
      onboarding: ${url.notifiche.cittadino.base}/onboarding
      onboarding-domicilio-digitale: ${url.notifiche.cittadino.base}/onboarding/domicilio-digitale
      onboarding-domicilio-avvisi: ${url.notifiche.cittadino.base}/onboarding/avvisi
      onboarding-domicilio-io: ${url.notifiche.cittadino.base}/onboarding/io
      informativa-privacy: ${url.notifiche.cittadino.base}/informativa-privacy
      termini-di-servizio: ${url.notifiche.cittadino.base}/termini-di-servizio
      termini-di-servizio-sercq-send: ${url.notifiche.cittadino.base}/termini-di-servizio/sercq-send
      assistenza: ${url.notifiche.cittadino.base}/assistenza
      profilo: ${url.notifiche.cittadino.base}/profilo
    persona-giuridica:
      base: https://imprese.test.notifichedigitali.it
      notifiche: ${url.notifiche.persona-giuridica.base}/notifiche
      notifiche-delegato: ${url.notifiche.persona-giuridica.base}/notifiche-delegato
      app-status: ${url.notifiche.persona-giuridica.base}/app-status
      integrazione-api: ${url.notifiche.persona-giuridica.base}/integrazione-api
      recapiti: ${url.notifiche.persona-giuridica.base}/recapiti
      deleghe-a-carico: ${url.notifiche.persona-giuridica.base}/deleghe/a-carico
      delegati: ${url.notifiche.persona-giuridica.base}/deleghe/delegati
      add-delegati: ${url.notifiche.persona-giuridica.base}/deleghe/delegati/nuova
    mittente:
      base: https://selfcare.test.notifichedigitali.it
      dashboard: ${url.notifiche.mittente.base}/dashboard
      new-notification: ${url.notifiche.mittente.dashboard}/nuova-notifica
      api-keys: ${url.notifiche.mittente.base}/api-keys
      new-api-key: ${url.notifiche.mittente.api-keys}/nuova-api-key
      app-status: ${url.notifiche.mittente.base}/app-status
      statistics: ${url.notifiche.mittente.base}/statistiche
      campaigns: ${url.notifiche.mittente.base}/campaigns
    supporto:
      base: https://uat.selfcare.pagopa.it

# Selettori XPath da properties
selettore:
  login:
    pg:
      area-riservata-selettore-env: '//*[@id="root"]/div/div[2]/div[2]/main/div/div[3]/div[2]/div[8]/div/div/div/div[3]/button'
  supporto:
    area-riservata-selettore-env: '//*[@id="root"]//table//tr[4]/td[5]//button'


# ============================================================================
# Authentication Tokens
# Bearer token for users
# ============================================================================
token:
  supporto: ${pn.external.bearer-token.tokenSupporto}
  session:
    lucrezia: ${pn.external.session-token.lucrezia:REPLACE_ME}
    garibaldi: ${pn.external.session-token.garibaldi:REPLACE_ME}
    dantealighieri: ${pn.external.session-token.dantealighieri:REPLACE_ME}
    francescopetrarca: ${pn.external.session-token.francescopetrarca:REPLACE_ME}
    grossini: ${pn.external.session-token.grossini:REPLACE_ME}
    albino63: ${pn.external.session-token.albino63:REPLACE_ME}

# ============================================================================
# BFF API Configuration (notifiche legali via API)
# ============================================================================
bff:
  api:
    base-url: https://webapi.test.notifichedigitali.it
    bearer-token: ${pn.external.bearer-token.tokenBffApiTest:REPLACE_ME}


# ============================================================================
# GPD API Configuration (posizioni debitorie)
# ============================================================================
gpd:
  api:
    base-url: https://api.uat.platform.pagopa.it/gpd/debt-positions-service/v1
    # REPLACE_ME: subscription key reale per l'header Ocp-Apim-Subscription-Key verso GPD
    subscription-key: REPLACE_ME

# ============================================================================
# Pn External Registries API Configuration (gruppi notifica per PA)
# ============================================================================
external-registries:
  api:
    base-url: https://api.test.notifichedigitali.it

# ============================================================================
# Pn Delivery B2B API Configuration (lettura notifiche via SenderReadB2BApi)
# ============================================================================
delivery:
  push:
    base-url: http://localhost:8889
  api:
    base-url: https://api.test.notifichedigitali.it
  informal:
    api:
      base-url: https://api.test.notifichedigitali.it/informal

