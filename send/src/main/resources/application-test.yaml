  groups-api-key:
    GROSSINI: 2a36ad69-fce0-416b-b94e-7242773e638b

# api-key per le API B2B delivery (header x-api-key), una entry per ogni costante di Tenant,
# univoca per PA e per ambiente (qui: test)
