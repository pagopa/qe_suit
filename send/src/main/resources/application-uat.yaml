# ============================================================================
# BFF API Configuration (notifiche legali via API)
# ============================================================================
bff:
  api:
    base-url: https://webapi.uat.notifichedigitali.it
    bearer-token: ${token.mittente}

# ============================================================================
# GPD API Configuration (posizioni debitorie)
# ============================================================================
gpd:
  api:
    base-url: https://api.uat.platform.pagopa.it/gpd/debt-positions-service/v1
    subscription-key: 7af5b95561f04499b38ced1bfaa492a6

# ============================================================================
# Pn External Registries API Configuration (gruppi notifica per PA)
# ============================================================================
external-registries:
  api:
    base-url: https://api.uat.notifichedigitali.it

# ============================================================================
# Pn Delivery B2B API Configuration (lettura notifiche via SenderReadB2BApi)
# ============================================================================
delivery:
  api:
    base-url: https://api.uat.notifichedigitali.it

# api-key per la chiamata GET /ext-registry-b2b/pa/v1/groups (header x-api-key), una entry per
# ogni costante di Tenant, univoca per PA e per ambiente (qui: uat)
pa:
  groups-api-key:
    GROSSINI: ee653bb9-399b-491a-acc3-46e60c910227

# api-key per le API B2B delivery (header x-api-key), una entry per ogni costante di Tenant,
# univoca per PA e per ambiente (qui: uat)
  delivery-api-key:
    GROSSINI: ee653bb9-399b-491a-acc3-46e60c910227
