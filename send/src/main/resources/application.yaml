# ============================================================================
# Spring Configuration
# ============================================================================
spring:
  profiles:
    active: dev

# ============================================================================
# Channel Configuration
# Defines browser settings for Web and Mobile channels
# ============================================================================
channel:
  web:
    browser: chrome
    headless: false
    arguments:
      - --window-size=1920,1080
      - --incognito
      - --lang=it-IT

# ============================================================================
# Logging Configuration
# ============================================================================
logging:
  level:
    E2E-Framework: DEBUG

