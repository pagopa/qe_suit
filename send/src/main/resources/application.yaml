# ============================================================================
# Spring Configuration
# ============================================================================
spring:
  profiles:
    active: test

# ============================================================================
# Channel Configuration
# Defines browser settings for Web and Mobile channels
# ============================================================================
channel:
  web:
    browser: chrome
    headless: false
    arguments:
      - --window-size=1920,1080
      - --incognito
      - --lang=it-IT

# ============================================================================
# Logging Configuration
# ============================================================================
logging:
  level:
    E2E-Framework: DEBUG

# ============================================================================
# BFF API Configuration (notifiche legali via API)
# ============================================================================
bff:
  api:
    base-url: https://webapi.dev.notifichedigitali.it
    # REPLACE_ME: sempre sovrascritto dal profilo attivo (test/dev/uat), valore reale solo in locale
    bearer-token: REPLACE_ME

