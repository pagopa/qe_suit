          type: string
          x-field-extra-annotation: '@lombok.ToString.Exclude'
          format: password
          minLength: 11
          maxLength: 16
          pattern: >-
            ^[A-Z]{6}[0-9LMNPQRSTUV]{2}[A-Z]{1}[0-9LMNPQRSTUV]{2}[A-Z]{1}[0-9LMNPQRSTUV]{3}[A-Z]{1}$|^(IT)?[0-9]{11}$
        groups:
