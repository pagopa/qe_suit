        - ATTACHMENT
        - LEGAL_FACT
        - AAR
    BffDocumentDownloadMetadataResponse:
      type: object
      required:
        - filename
        - contentLength
      properties:
        filename:
          type: string
        contentLength:
          type: number
          format: decimal32
          description: dimensione, in byte, del contenuto.
        url:
          type: string
          description: >-
            URL pre-autorizzato a cui effettuare una richiesta GET per ottenere
            il  contenuto del documento. Presente solo se il documento è pronto
            per il download.
        retryAfter:
          type: number
          format: decimal32
          description: >-
