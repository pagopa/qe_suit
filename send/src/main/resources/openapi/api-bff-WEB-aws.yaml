      description: Request per il censimento di una nuova public key
      type: object
      required:
        - publicKey
      properties:
        name:
          type: string
          description: nome della public key
          maxLength: 254
          pattern: ^[a-zA-Z0-9-\s]+$
        publicKey:
          type: string
          description: Valore della public key (esclusi header e footer)
          maxLength: 500
        exponent:
          type: string
          description: Esponente della public key
          default: AQAB
