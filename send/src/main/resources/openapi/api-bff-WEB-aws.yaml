          type: string
          maxLength: 5
          pattern: ^[0-9]*$
        groups:
          type: array
          items:
            type: string
            maxLength: 80
            pattern: ^[ -~ ]*$
    UpdateRequestDto:
      type: object
      properties:
        groups:
          type: array
          maxItems: 10
          items:
            type: string
            maxLength: 39
            pattern: ^[ -~ ]*$
    MandateDto:
      type: object
      properties:
        mandateId:
          description: Available always, not required on mandate creation.
          oneOf:
            - type: string
              maxLength: 36
              pattern: >-
                ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
            - type: 'null'
        delegator:
          $ref: '#/components/schemas/UserDto'
        delegate:
          $ref: '#/components/schemas/UserDto'
        status:
          description: Available always, not required on mandate creation.
          oneOf:
            - type: string
              enum:
                - pending
                - active
                - revoked
                - rejected
                - expired
            - type: 'null'
        visibilityIds:
          description: Available always, not required on mandate creation.
          oneOf:
            - type: array
              items:
                $ref: '#/components/schemas/OrganizationIdDto'
            - type: 'null'
        verificationCode:
          description: Available only for request where requesting user is the delegator
          oneOf:
            - type: string
              maxLength: 5
              pattern: ^[0-9]*$
            - type: 'null'
        datefrom:
          type: string
          description: ISO 8601 format
          maxLength: 10
          pattern: ^\d{4}\-(0[1-9]|1[012])\-(0[1-9]|[12][0-9]|3[01])$
        dateto:
          type: string
          description: ISO 8601 format
          maxLength: 10
          pattern: ^\d{4}\-(0[1-9]|1[012])\-(0[1-9]|[12][0-9]|3[01])$
        groups:
          type: array
          items:
            $ref: '#/components/schemas/GroupDto'
    SearchMandateRequestDto:
