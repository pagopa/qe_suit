      x-amazon-apigateway-integration:
        uri: >-
          http://${stageVariables.ApplicationLoadBalancerDomain}:8080/${stageVariables.ServiceApiPath}/v1/notifications/informal/sent/{iun}/attachments/documents/{docIdx}
        connectionId: ${stageVariables.NetworkLoadBalancerLink}
