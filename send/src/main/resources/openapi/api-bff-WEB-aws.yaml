    StatusDetail:
      description: Detail of response to cancellation async call
      type: object
      required:
        - code
      properties:
        code:
          description: Internal code of the error or warning, in human-readable format
          example: NOTIFICATION_CANCELLATION_ACCEPTED, NOTIFICATION_ALREADY_CANCELLED
          type: string
        level:
          description: |
            informational level of status detail: INFO,WARN, ERR
            ERR (error) by default
          example: INFO
          type: string
        detail:
          description: >-
            A human readable explanation specific to this occurrence of the
            problem.
          example: Parameter not valid
          type: string
    RequestStatus:
      description: Response to cancellation async call
      type: object
      properties:
        status:
          description: |
            Cancellation request status:
              - OK
          type: string
        details:
          type: array
          maxItems: 9999
          items:
            $ref: '#/components/schemas/StatusDetail'
      required:
        - status
    PreLoadRequest:
      title: Richiesta di precaricamento di un File
      type: object
      required:
        - sha256
      properties:
        preloadIdx:
          title: Id della richiesta di precaricamento di un file
          description: >-
            Identificativo univoco all'interno della request HTTP, serve per
            correlare la risposta. Stringa alfanumerica con caratteri
            utilizzabili in un nome file.
          type: string
          minLength: 1
          maxLength: 512
          pattern: ^[a-zA-Z0-9._-]{1,512}$
        contentType:
          title: MIME type del file che verrà caricato
          description: >-
            Il MIME type dell'allegato che dovrà essere caricato. Attualmente
            sono supportati
              - application/pdf
              - application/json
          type: string
          minLength: 15
          maxLength: 16
          pattern: ^application\/(pdf|json)$
        sha256:
          title: checksum sha256 del file che verrà caricato
          description: >-
            checksum sha256, codificato in base 64, del contenuto binario del
            file che verrà caricato
          type: string
          example: jezIVxlG1M1woCSUngM6KipUN3/p8cG5RMIPnuEanlE=
          minLength: 44
          maxLength: 44
          pattern: ^[A-Za-z0-9+\/]{43}=|[A-Za-z0-9+\/]{44}$
    PreLoadResponse:
      title: Informazioni per il caricamento file
      description: >-
        Per ogni richiesta che è stata fatta viene fornito un presigned URL e
        le  informazioni per usarlo.
      type: object
      properties:
        preloadIdx:
          description: >-
            per correlazione con la richiesta. Stringa alfanumerica con
            caratteri utilizzabili in un file.
          type: string
          minLength: 1
          maxLength: 512
          pattern: ^[a-zA-Z0-9._-]{1,512}$
        secret:
          description: >-
            Token aggiuntivo per far si che sia necessario intercettare anche
            gli  header e non solo l'URL di upload del contenuto del documento.
          example: AZ23RF12
          type: string
        httpMethod:
          description: >-
            Indica se per l'upload del contenuto file bisogna utilizzare il
            metodo PUT o POST
          type: string
          example: PUT
          enum:
            - POST
            - PUT
        url:
          description: URL a cui effettuare l'upload del contenuto del documento.
          type: string
          example: https://preloadpn.aws.amazon.......
        key:
          description: >-
            la chiave restituita sarà globalmente unica e andrà utilizzata nella
            richiesta  di notifica.
          example: PN_NOTIFICATION_ATTACHMENTS-0001-301W-B9CB-9U72-WIKD
          type: string
    UnifiedNotificationStatus:
      description: >-
        Stato unificato della notifica per i destinatari. Contiene i valori di
        NotificationStatusV26 quando il campo communicationType è LEGAL, oppure
        i valori di InformalNotificationStatus quando il campo communicationType
        è INFORMAL. N.B. l'enum è l'unione dei valori di NotificationStatusV26
        (notifiche legali) e di InformalNotificationStatus (notifiche bonarie).
        Va mantenuto allineato a tali enum.
      type: string
      enum:
        - IN_VALIDATION
        - ACCEPTED
        - REFUSED
        - DELIVERING
        - DELIVERED
        - VIEWED
        - EFFECTIVE_DATE
        - PAID
        - UNREACHABLE
        - CANCELLED
        - RETURNED_TO_SENDER
        - PROCESSING
        - COMPLETED_REACHED
        - COMPLETED_UNREACHED
        - UNDELIVERABLE
    CommunicationOutcomes:
      type: object
      description: >-
        Esiti della comunicazione (solo per comunicazioni post-rilascio).
        Valorizzato esclusivamente per le notifiche bonarie (communicationType
        INFORMAL); per le notifiche legali (communicationType LEGAL) non viene
        mai valorizzato.
      properties:
        viewed:
          type: boolean
          description: Indica se la comunicazione è stata visualizzata dal destinatario
        delivered:
          type: boolean
          description: Indica se la comunicazione è stata consegnata al destinatario
    FullNotificationSearchRow:
      description: >-
        Riga di risultato della ricerca di notifiche completa (legali e
        bonarie). Estende NotificationSearchRow aggiungendo i campi
        notificationStatus (unificato per legali e bonarie) e
        communicationOutcomes. Il campo notificationStatus conterrà valori di
        NotificationStatusV26 se communicationType è LEGAL, oppure valori di
        InformalNotificationStatus se communicationType è INFORMAL.
      allOf:
        - $ref: '#/components/schemas/NotificationSearchRow'
        - type: object
          properties:
            notificationStatus:
              $ref: '#/components/schemas/UnifiedNotificationStatus'
            communicationOutcomes:
              description: >-
                Esiti della comunicazione. Valorizzato esclusivamente per le
                notifiche bonarie (communicationType INFORMAL); per le notifiche
                legali (communicationType LEGAL) non viene mai valorizzato.
              allOf:
                - $ref: '#/components/schemas/CommunicationOutcomes'
    BffFullNotificationSearchRow:
      allOf:
        - $ref: '#/components/schemas/FullNotificationSearchRow'
        - $ref: '#/components/schemas/BffIsNewNotification'
    BffFullNotificationsResponse:
      properties:
        resultsPage:
          type: array
          items:
            $ref: '#/components/schemas/BffFullNotificationSearchRow'
        moreResult:
          type: boolean
        nextPagesKey:
          type: array
          items:
            type: string
    RequestCheckAarMandateDto:
      description: Le informazioni fornite per verificare l'AAR-QR-CodeValue
      type: object
      required:
        - aarQrCodeValue
      properties:
        aarQrCodeValue:
          type: string
          description: valore del token QR-Code presente sull'avviso di avvenuta ricezione
          pattern: ^[A-Za-z0-9_-]*$
          minLength: 106
          maxLength: 136
    ResponseCheckAarMandateDto:
      description: >-
        Le informazioni fornite in risposta alla verifica del AAR-QR-CodeValue
        con possibile identificativo della delega attiva
      type: object
      required:
        - iun
      properties:
        iun:
          $ref: '#/components/schemas/IUN'
        mandateId:
          description: identificativo della delega
          type: string
    RetrievalPayload:
      type: object
      required:
        - retrievalId
      description: Retrieval Response information
      properties:
        retrievalId:
          type: string
          description: Unique ID that identify retrieval payload
          pattern: ^[ -~]{1,50}$
          minLength: 50
          maxLength: 50
          example: 0e4c6629-8753-234s-b0da-1f796999ec2-15038637960920
        tppId:
          type: string
          description: Unique ID that identify TPP on PagoPA systems
          pattern: ^[ -~]{1,50}$
          minLength: 50
          maxLength: 50
          example: 0e3bee29-8753-447c-b0da-1f7965558ec2-1706867960900
        deeplink:
          type: string
          description: >-
            Represents the deep link (DeepLink) that allows direct redirection
            to a specific section or feature of the TPP app. It must be an
            alphanumeric string respecting a specific format and be between 48
            and 128 characters in length.
          pattern: ^[a-zA-Z0-9._~:/?#\[\]@!$&'()*+,;=-]{48,128}$
          minLength: 10
          maxLength: 128
          example: >-
            https://example.com/deeplink/123e4567-e89b-12d3-a456-426614174000?userId=1234567890&session=abcdef
        pspDenomination:
          type: string
          description: Payment button label (e.g., the name of the payment provider).
          pattern: ^[a-zA-Z0-9 ]{1,15}$
          minLength: 1
          maxLength: 15
          example: Banca1
        originId:
          type: string
          description: ID of the original message
          pattern: ^[ -~]{24,36}$
          minLength: 24
          maxLength: 36
          example: XRUZ-GZAJ-ZUEJ-202407-W-1
        isPaymentEnabled:
          type: boolean
          description: >-
            ENG: Flag indicating whether the TPP is integrated with the payment
            system. - IT: Flag che indica se il TPP è integrato con il sistema
            di pagamento.
