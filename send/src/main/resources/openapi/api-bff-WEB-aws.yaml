        - in: path
          name: channelType
          description: Communication Channel type
          required: true
          schema:
            $ref: '#/components/schemas/BffChannelType'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddressVerification'
      responses:
        '200':
          content:
