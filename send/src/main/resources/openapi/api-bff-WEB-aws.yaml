          description: Algoritmo di crittografia usato per la generazione della public key
          type: string
          enum:
            - RSA
          default: RSA
        keySize:
          description: Dimensione della chiave
          # PATCH LOCALE (vedi openapi/README.md): upstream dichiara `type: number`.
          # Con `number` + `enum`, openapi-generator 7.19.0 emette
          # `BigDecimal.valueOf(new BigDecimal("2048"))`, che non compila.
          # `integer` e' semanticamente fedele e genera un enum valido.
          type: integer
          format: int32
          enum:
            - 2048
          default: 2048
