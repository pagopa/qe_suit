    PagoPaPaymentBase:
      title: Informazioni per effettuare il pagamento con sistema pagoPA
      description: >-
        Informazioni utili per effettuare il pagamento di una notifica, sono
        associate al destinatario perché le spese di notifica possono differire
        a seconda del canale di notifica utilizzato. <br/>
          - _noticeCode_: "codice avviso pagoPA" di pagamento del sistema pagoPA, usato per pagamento online.<br/>
          - _creditorTaxId_: codice fiscale dell'ente a cui fa riferimento il "codice avviso pagoPA". <br/>
          - _attachment_: riferimento al PDF contenete il bollettino pagoPA<br/>
      type: object
      required:
        - noticeCode
        - creditorTaxId
        - amount
      properties:
        noticeCode:
          $ref: '#/components/schemas/noticeCode'
        creditorTaxId:
          $ref: '#/components/schemas/paTaxId'
        attachment:
          $ref: '#/components/schemas/NotificationPaymentAttachment'
        amount:
          type: number
          description: Importo del pagamento in eurocent
          minimum: 0
        dueDate:
          type: string
          format: date-time
          description: >-
            Data di scadenza del pagamento. Il formato data deve essere ISO-8601
            e fuso orario UTC
    InformalNotificationPaymentItem:
      description: >-
        Elemento di pagamento della notifica informale. Al momento è supportato
        esclusivamente il pagamento pagoPA.
      type: object
      additionalProperties: false
      required:
        - pagoPa
      properties:
        pagoPa:
          $ref: '#/components/schemas/PagoPaPaymentBase'
    InformalNotificationPayments:
      description: >-
        Lista dei pagamenti collegati alla notifica informale per il
        destinatario.
      type: array
      items:
        $ref: '#/components/schemas/InformalNotificationPaymentItem'
    InformalNotificationRecipientV1:
      description: >-
        Dati del destinatario specifici per una notifica informale, inclusi il
        riferimento al messaggio e i canali opzionali di contatto.
      allOf:
        - $ref: '#/components/schemas/NotificationRecipientV24'
        - type: object
          required:
            - messageId
          properties:
            payments:
              $ref: '#/components/schemas/InformalNotificationPayments'
            messageId:
              type: string
              format: uuid
              description: >-
                Identificativo del template di messaggio da utilizzare per il
                destinatario.
            email:
              type: string
              x-field-extra-annotation: '@lombok.ToString.Exclude'
              example: account@domain.it
              description: >-
                Indirizzo email che il mittente della notifica intende
                utilizzare per  raggiungere il destinatario.
              pattern: >-
                ^(?:[a-zA-Z0-9!#$%&'*+/=?^_`{|}~-]+(?:\.[a-zA-Z0-9!#$%&'*+/=?^_`{|}~-]+)*|"(?:[\x01-\x08\x0b\x0c\x0e-\x1f\x21\x23-\x5b\x5d-\x7f]|\\[\x01-\x09\x0b\x0c\x0e-\x7f])*")@(?:(?:[a-zA-Z0-9](?:[a-zA-Z0-9-]*[a-zA-Z0-9])?\.)+[a-zA-Z0-9](?:[a-zA-Z0-9-]*[a-zA-Z0-9])?|\[(?:(?:25[0-5]|2[0-4]\d|[01]?\d\d?)\.){3}(?:25[0-5]|2[0-4]\d|[01]?\d\d?|[a-zA-Z0-9-]*[a-zA-Z0-9]:(?:[\x01-\x08\x0b\x0c\x0e-\x1f\x21-\x5a\x53-\x7f]|\\[\x01-\x09\x0b\x0c\x0e-\x7f])+)\])$
              maxLength: 320
            phoneNumber:
              type: string
              x-field-extra-annotation: '@lombok.ToString.Exclude'
              example: '+3900000000'
              description: >-
                Numero di telefono che il mittente della notifica intende
                utilizzare per raggiungere il destinatario, espresso in formato
                internazionale con prefisso `+` oppure `00`.
              pattern: ^(\+|00)[1-9]\d{0,3}[\s.-]?\d{1,4}[\s.-]?\d{1,4}[\s.-]?\d{1,9}$
              maxLength: 30
            additionalLanguages:
              description: >-
                In questo campo è possibile definire la lingua addizionale
                (oltre a quella italiana) da utilizzare per l'invio del
                messaggio sui canali configurati.<br/> Le lingue accettate e
                dunque i valori possibili degli item dell'array sono: <br/> - DE
                <br/> - SL <br/> - FR <br/> DE (tedesco), SL (sloveno), FR
                (francese) Attualmente è possibile indicare un solo item e
                dunque una sola lingua aggiuntiva. Se non vengono indicate
                lingue aggiuntive la lingua utilizzata <br/> per l'invio del
                messaggio sui canali configurati sarà quella italiana. <br />
                **Coerenza con messageId:** Se viene fornito un `messageId`, il
                messaggio identificato deve essere associato alla lingua
                indicata in questo campo. <br/>
              type: array
              maxItems: 1
              items:
                type: string
    LocalizedContent:
      type: object
      required:
        - subject
        - longBody
        - language
      properties:
        subject:
          type: string
          minLength: 10
          maxLength: 120
          description: Titolo del messaggio (es. Oggetto della mail o intestazione IO)
          example: Sollecito di pagamento Tari 2023
          x-field-extra-annotation: '@lombok.ToString.Exclude'
          format: password
        longBody:
          type: string
          minLength: 80
          maxLength: 9000
          description: Corpo esteso del messaggio in formato Markdown
          example: >-
            Gentile cittadino, la informiamo che dobbiamo raggiungere 80
            caratteri per il corpo del messaggio, quindi questo è un esempio di
            testo che supera i 80 caratteri. Il messaggio può essere più lungo
          x-field-extra-annotation: '@lombok.ToString.Exclude'
          format: password
        shortBody:
          type: string
          maxLength: 160
          description: Versione breve per SMS o anteprime
          example: 'Sollecito Tari: hai una nuova comunicazione da SEND.'
          x-field-extra-annotation: '@lombok.ToString.Exclude'
          format: password
        language:
          type: string
          description: >-
            Lingua del messaggio. Valori accettati: - IT <br/> - DE <br/> - SL
            <br/> - FR <br/> DE (tedesco), SL (sloveno), FR (francese).
    NewMessageRequest:
      type: object
      required:
        - primaryMessage
      properties:
        primaryMessage:
          allOf:
            - $ref: '#/components/schemas/LocalizedContent'
            - description: >-
                Contenuto principale del messaggio, deve essere in lingua
                italiana
        additionalMessage:
          allOf:
            - $ref: '#/components/schemas/LocalizedContent'
            - description: >-
                Contenuto aggiuntivo del messaggio, opzionale, può essere in una
                lingua diversa dall'italiano
    FullInformalNotificationRecipientV1:
      allOf:
        - $ref: '#/components/schemas/InformalNotificationRecipientV1'
        - type: object
          required:
            - message
          properties:
            message:
              $ref: '#/components/schemas/NewMessageRequest'
    InformalNotificationStatusV1:
      type: string
      description: |
        stato di avanzamento del processo di notifica bonaria:
          * `IN_VALIDATION` - Fase di validazione formale, sintattica (sincrona) ed asincrona (verifica allegati e coerenza della campagna)
          * `PROCESSING` - Stato assunto non appena la validazione ha esito positivo e l'orchestratore avvia il workflow sequenziale di consegna sui canali
          * `COMPLETED_REACHED` - Stato finale di terminazione positiva; Il destinatario è stato raggiunto alla destinazione più vicina al cittadino, ma non è stato ancora ottenuto il feedback di arresto finale desiderato dall'ente;
          * `COMPLETED_UNREACHED` - Stato finale di terminazione negativa; Il destinatario non è stato raggiunto alla destinazione più vicina al cittadino;
          * `UNDELIVERABLE` - Stato di irreperibilità totale; raggiungibile solo se la validazione asincrona consente l'ingresso di notifiche prive di qualsiasi recapito utile o di profilo IO associato
          * `REFUSED` - Notifica rifiutata a seguito della validazione
          * `ACCEPTED` - Notifica accettato a seguito della validazione
      enum:
        - IN_VALIDATION
        - PROCESSING
        - COMPLETED_REACHED
        - COMPLETED_UNREACHED
        - UNDELIVERABLE
        - REFUSED
        - ACCEPTED
    SenderContactInfo:
      description: >-
        Le informazioni riguardanti i contatti dell'ente mittente della notifica
        bonaria.
      type: object
      required:
        - senderId
      properties:
        senderId:
          type: string
          description: Identificativo del mittente della notifica bonaria
        email:
          type: string
          description: Email del mittente della notifica bonaria
        pec:
          type: string
          description: PEC del mittente della notifica bonaria
        phone:
          type: string
          description: Telefono del mittente della notifica bonaria
        site:
          type: string
          description: Sito web del mittente della notifica bonaria
    InformalTimelineElementCategoryV1:
      type: string
      description: >
        Categorie degli elementi della timeline nel dominio delle notifiche
        bonarie:
          * `PUBLIC_REGISTRY_VALIDATION_CALL` - Ricerca dell'indirizzo di spedizione in fase di validazione notifica
          * `PUBLIC_REGISTRY_VALIDATION_RESPONSE` - Recupero dell'indirizzo di spedizione dai registri nazionali
          * `VALIDATE_NORMALIZE_ADDRESSES_REQUEST` - Invio della richiesta di validazione e normalizzazione indirizzi fisici presenti nella richiesta di notifica
          * `NORMALIZED_ADDRESS` - Salvataggio indirizzi normalizzati
          * `REQUEST_ACCEPTED` - Richiesta di notifica accettata a seguito dei controlli di validazione
          * `REQUEST_REFUSED` - Richiesta di notifica rifiutata per fallimento dei controlli di validazione
          * `COVERPAGE_CREATION_REQUEST` - Richiesta di generazione della pagina di copertina o dei moduli di pagamento
          * `SEND_DIGITAL_MESSAGE` - Tentativo di invio del messaggio sui canali digitali (App IO, Email, SMS)
          * `SEND_DIGITAL_MESSAGE_PROGRESS` - Aggiornamento sullo stato di avanzamento dell'invio digitale
          * `SEND_DIGITAL_MESSAGE_FEEDBACK` - Ricezione del feedback di consegna (esito) del messaggio digitale
          * `SEND_DIGITAL_MESSAGE_SKIP` - Salto programmato dell'invio digitale (es. canale non disponibile)
          * `PREPARE_ANALOG_DELIVERY` - Avvio della fase di preparazione per la spedizione cartacea/analogica
          * `SEND_ANALOG_MESSAGE` - Affidamento della richiesta di spedizione al vettore analogico (es. Poste/vettore)
          * `SEND_ANALOG_MESSAGE_PROGRESS` - Aggiornamento sullo stato di avanzamento della spedizione analogica
          * `SEND_ANALOG_MESSAGE_FEEDBACK` - Ricezione dell'esito o feedback di consegna della spedizione cartacea
          * `DELIVERED` - Notifica o messaggio consegnato con successo al destinatario
          * `INFORMAL_NOTIFICATION_VIEWED` - Presa visione o lettura della notifica bonaria da parte del destinatario
          * `PAYMENT` - Registrazione del pagamento associato alla notifica bonaria
          * `WORKFLOW_ENDED_REACHED` - Flusso terminato: il destinatario è stato raggiunto con successo
          * `WORKFLOW_ENDED_UNREACHED` - Flusso terminato: il destinatario non è stato raggiunto nei tempi previsti
          * `WORKFLOW_ENDED_UNDELIVERABLE` - Flusso terminato: la notifica è definitivamente irrecapitabile su ogni canale
          * `WORKFLOW_DONE_REACHED` - Elaborazione del workflow completata per riscontro su un feedback desiderato e destinatario raggiunto
          * `WORKFLOW_DONE_UNREACHED` - Elaborazione del workflow completata per riscontro su un feedback desiderato e destinatario non raggiunto
          * `SEND_COURTESY_MESSAGE` - Invio di un messaggio di cortesia
          * `GET_ADDRESS` - Disponibilità dell’indirizzo specifico (domicilio digitale di piattaforma, domicilio digitale speciale, domicilio digitale generale)
          * `PUBLIC_REGISTRY_CALL` - Richiesta ai registri pubblici per ottenere domicilio digitale generale o per ottenere indirizzo fisico da ANPR, da registro della imprese, da anagrafe tributaria.
          * `PUBLIC_REGISTRY_RESPONSE` - Ricevuta la risposta dei registri pubblici
      enum:
        - PUBLIC_REGISTRY_VALIDATION_CALL
        - PUBLIC_REGISTRY_VALIDATION_RESPONSE
        - VALIDATE_NORMALIZE_ADDRESSES_REQUEST
        - NORMALIZED_ADDRESS
        - REQUEST_ACCEPTED
        - REQUEST_REFUSED
        - SEND_DIGITAL_MESSAGE
        - SEND_DIGITAL_MESSAGE_PROGRESS
        - SEND_DIGITAL_MESSAGE_FEEDBACK
        - SEND_DIGITAL_MESSAGE_SKIP
        - PREPARE_ANALOG_DELIVERY
        - SEND_ANALOG_MESSAGE
        - SEND_ANALOG_MESSAGE_PROGRESS
        - SEND_ANALOG_MESSAGE_FEEDBACK
        - DELIVERED
        - WORKFLOW_ENDED_REACHED
        - WORKFLOW_ENDED_UNREACHED
        - WORKFLOW_ENDED_UNDELIVERABLE
        - WORKFLOW_DONE_REACHED
        - WORKFLOW_DONE_UNREACHED
        - INFORMAL_NOTIFICATION_VIEWED
        - COVERPAGE_CREATION_REQUEST
        - PAYMENT
        - GET_ADDRESS
        - PUBLIC_REGISTRY_CALL
        - PUBLIC_REGISTRY_RESPONSE
        - SEND_COURTESY_MESSAGE
