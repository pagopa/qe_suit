    Timestamp:
      type: string
      format: date-time
    Money:
      type: object
      properties:
        amount:
          type: number
          format: double
        currency:
          type: string
          example: EUR
    ErrorDetail:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
    Entity0000:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Id'
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        price:
          $ref: '#/components/schemas/Money'
        parent:
          $ref: '#/components/schemas/Id'
        children:
          type: array
          items:
            $ref: '#/components/schemas/Timestamp'
      allOf:
      - $ref: '#/components/schemas/Id'
    Entity0001:
