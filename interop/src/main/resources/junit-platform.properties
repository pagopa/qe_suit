cucumber.execution.parallel.enabled=true
cucumber.execution.parallel.config.strategy=dynamic

# Configurazione di default per l'esecuzione locale dei test di contratto.
# I DynamicTest vengono eseguiti in modalità same_thread per mantenere la console leggibile
# ed evitare interleaving dei log durante il debugging locale.
# Il capture di stdout/stderr è disabilitato per evitare la visualizzazione duplicata
# dello stesso output nella console IntelliJ.
junit.jupiter.execution.parallel.enabled=false
junit.jupiter.execution.parallel.mode.default=same_thread
junit.platform.output.capture.stdout=false
junit.platform.output.capture.stderr=false

# Configurazione alternativa per l'esecuzione parallela locale dei test di contratto.
#
# Con i DynamicTest eseguiti in parallelo, più thread scrivono contemporaneamente
# sullo stesso stdout/stderr della JVM. La console live può quindi mostrare log
# appartenenti a scenari diversi interleavati tra loro.
#
# Se il capture JUnit di stdout/stderr è attivo, IntelliJ può mostrare:
#   1. lo stdout live globale, che può contenere log interleavati di più test;
#   2. il blocco catturato da JUnit e associato al singolo DynamicTest.
#
# Questo può far APPARIRE alcuni log duplicati, anche se gli eventi Logback
# vengono emessi una sola volta.
#
# Il blocco correttamente associato al singolo test è quello pubblicato da JUnit
# e riconoscibile dalla riga che inizia con:
#
#   timestamp = ..., stdout = ...
#
# Da quel punto in poi l'output appartiene al DynamicTest selezionato.
#
# Negli scenari reali il fenomeno è generalmente meno evidente perché le chiamate
# HTTP hanno latenze e tempi di risposta differenti, distribuendo i log nel tempo.
# L'interleaving risulta invece più visibile quando più test producono output
# quasi simultaneamente, ad esempio con errori o response molto rapide.
#
#junit.jupiter.execution.parallel.enabled=true
#junit.jupiter.execution.parallel.mode.default=concurrent
#junit.jupiter.execution.parallel.config.strategy=dynamic
#junit.platform.output.capture.stdout=true
#junit.platform.output.capture.stderr=true