# ============================================================================
# Spring Configuration
# ============================================================================
spring:
  profiles:
    active: qa

# ============================================================================
# Channel Configuration
# Defines browser settings for Web and Mobile channels
# ============================================================================
channel:
  web:
    browser: chrome
    headless: true
    arguments:
      - --window-size=1920,1080
      - --incognito

# ============================================================================
# Logging Configuration
# Il livello della suite e' gestito da logback.xml tramite la variabile
# SUIT_LOG_LEVEL (default INFO), perche' logback viene inizializzato da surefire
# prima del contesto Spring.
# ============================================================================

# ============================================================================
# Open-api URLs Configuration
# Centralizzato e iniettato direttamente dal POM tramite Spring
# ============================================================================
interop:
  api:
    openapi-url:
      bff: @bff.openapi.url@

contract-report:
  channels:
    bff:
      label: BFF
      class-prefix: Bff
      target-type: OPENAPI
      openapi: @bff.openapi.url@
    web:
      label: WEB
      class-prefix: Web
      target-type: PAGE
