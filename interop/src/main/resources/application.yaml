# ============================================================================
# Spring Configuration
# ============================================================================
spring:
  profiles:
    active: qa

# ============================================================================
# Channel Configuration
# Defines browser settings for Web and Mobile channels
# ============================================================================
channel:
  web:
    browser: chrome
    headless: true
    arguments:
      - --window-size=1920,1080
      - --incognito

# ============================================================================
# Logging Configuration
# ============================================================================
logging:
  level:
    suit: DEBUG

# ============================================================================
# Open-api URLs Configuration
# Centralizzato e iniettato direttamente dal POM tramite Spring
# ============================================================================
interop:
  api:
    openapi-url:
      bff: @bff.openapi.url@
