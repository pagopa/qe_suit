name: ci-rules

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  validate-rules:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Validate branch naming
        shell: bash
        run: bash .github/scripts/validate-branch-naming.sh

      - name: Validate commit messages
        shell: bash
        env:
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GITHUB_BEFORE_SHA: ${{ github.event.before }}
          GITHUB_AFTER_SHA: ${{ github.sha }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: bash .github/scripts/validate-commit-messages.sh

      - name: Run install SUIT
        working-directory: frontend-e2e-framework
        run: bash ./mvnw -DskipTests install

      - name: Run install COMMON
        working-directory: common
        run: bash ./mvnw -DskipTests install

      - name: Run interop tests (ci-rules profile)
        working-directory: interop
        run: bash ./mvnw -Pci-rules test
