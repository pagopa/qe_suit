name: ci-rules

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  validate-rules:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Validate branch naming
        shell: bash
        run: bash .github/scripts/validate-branch-naming.sh

      - name: Validate commit messages
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
            RANGE="$BASE_SHA..$HEAD_SHA"
          else
            BEFORE_SHA="${{ github.event.before }}"
            AFTER_SHA="${{ github.sha }}"

            # caso primo commit / evento non standard
            if [[ -z "$BEFORE_SHA" || "$BEFORE_SHA" == "0000000000000000000000000000000000000000" ]]; then
              RANGE="$AFTER_SHA"
            else
              RANGE="$BEFORE_SHA..$AFTER_SHA"
            fi
          fi

          bash .github/scripts/validate-commit-messages.sh "$RANGE"

      - name: Run install SUIT
        working-directory: frontend-e2e-framework
        run: bash ./mvnw -DskipTests install

      - name: Run interop architecture rule suite
        working-directory: interop
        run: bash ./mvnw -Dtest=ArchitectureRulesTest test
