name: Verify Copilot CLI in Actions

on:
  workflow_dispatch:

permissions:
  contents: read
  copilot-requests: write

jobs:
  verify-copilot:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install Copilot CLI
        run: npm install --global @github/copilot

      - name: Verify Copilot access
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          copilot \
            --prompt "Respond exactly with: COPILOT_OK" \
            --silent \
            --no-ask-user
