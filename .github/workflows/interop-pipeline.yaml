name: "[INTEROP] QA workflow"

on:
  schedule:
    # 06:00 UTC = 08:00 Europe/Rome (CEST) / 07:00 (CET). I cron di GitHub sono sempre UTC.
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to run tests against'
        required: true
        default: qa
        type: choice
        options:
          - dev
          - qa
      javaTestSuite:
        description: 'Choose which Java test suite to run'
        required: false
        default: NrtStandardSuite
        type: string
      branchName:
        description: 'Branch di qe_suit da testare (indipendente dal branch selezionato in "Use workflow from")'
        required: false
        default: ''
        type: string

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  run_tests:
    name: Run Java Selenium Tests
    runs-on: ubuntu-22.04
    env:
      ENVIRONMENT: ${{ inputs.environment || 'qa' }}
      JAVA_TEST_SUITE: ${{ inputs.javaTestSuite || 'NrtStandardSuite' }}
      BRANCH_NAME: ${{ inputs.branchName || github.ref_name }}

    steps:
      - name: Set up Maven
        uses: s4u/setup-maven-action@6d44c18d67d9e1549907b8815efa5e4dada1801b
        with:
          java-version: 17
          maven-version: 3.9.8

      - name: Install Chrome Browser
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable
          google-chrome --version

      - name: Setup ChromeDriver
        uses: nanasess/setup-chromedriver@master

      - name: Checkout qe_suit repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH_NAME }}
          path: qe_suit

      - name: Build frontend-e2e-framework
        run: |
          cd ./qe_suit/frontend-e2e-framework
          mvn clean install -DskipTests

      - name: Build common
        run: |
          cd ./qe_suit/common
          mvn clean install -DskipTests

      - name: Run Selenium Tests
        run: |
          cd ./qe_suit/interop

          if [[ "${{ env.ENVIRONMENT }}" == "dev" ]]; then
            SPRING_PROFILE="-Dspring.profiles.active=dev"
          else
            SPRING_PROFILE="-Dspring.profiles.active=qa"
          fi

          mvn test $SPRING_PROFILE -Dtest=${{ env.JAVA_TEST_SUITE }}

      - name: Upload Test Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: ./qe_suit/interop/target/logs/
          if-no-files-found: warn

      - name: Upload Cucumber Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-report
          path: ./qe_suit/interop/target/cucumber-reports/
          if-no-files-found: warn
          retention-days: 10