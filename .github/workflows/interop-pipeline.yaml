name: "[INTEROP] QA workflow"

on:
  schedule:
    # 06:00 UTC = 08:00 Europe/Rome durante CEST.
    # Attenzione: in inverno 06:00 UTC = 07:00 CET.
    - cron: '0 6 * * *'

  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to run tests against'
        required: true
        default: qa
        type: choice
        options:
          - dev
          - qa

      javaTestSuite:
        description: 'Choose which Java test suite to run'
        required: false
        default: NrtStandardSuiteTest
        type: string

      branchName:
        description: 'Branch di qe_suit da testare (indipendente dal branch selezionato in "Use workflow from")'
        required: false
        default: ''
        type: string

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  run_tests:
    name: Run Java Selenium Tests
    runs-on: ubuntu-22.04

    env:
      ENVIRONMENT: ${{ inputs.environment || 'qa' }}
      JAVA_TEST_SUITE: ${{ inputs.javaTestSuite || 'NrtStandardSuiteTest' }}
      BRANCH_NAME: ${{ inputs.branchName || github.ref_name }}

      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      AWS_REGION: eu-south-1
      AWS_DEFAULT_REGION: eu-south-1

    steps:
      - name: Verify AWS credentials
        run: |
          echo "Checking AWS identity..."
          aws sts get-caller-identity

      - name: Set up Maven
        uses: s4u/setup-maven-action@6d44c18d67d9e1549907b8815efa5e4dada1801b
        with:
          java-version: 17
          maven-version: 3.9.8

      - name: Install Chrome Browser
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable
          google-chrome --version

      - name: Setup ChromeDriver
        uses: nanasess/setup-chromedriver@master

      - name: Checkout qe_suit repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH_NAME }}
          path: qe_suit

      - name: Build frontend-e2e-framework
        run: |
          cd ./qe_suit/frontend-e2e-framework
          mvn -B -ntp clean install -DskipTests

      - name: Build common
        run: |
          cd ./qe_suit/common
          mvn -B -ntp clean install -DskipTests

      - name: Run Test Suite
        run: |
          cd ./qe_suit/interop

          if [[ "${{ env.ENVIRONMENT }}" == "dev" ]]; then
            SPRING_PROFILE="-Dspring.profiles.active=dev"
          else
            SPRING_PROFILE="-Dspring.profiles.active=qa"
          fi

          echo "Environment: ${{ env.ENVIRONMENT }}"
          echo "Spring profile: $SPRING_PROFILE"
          echo "Test suite: ${{ env.JAVA_TEST_SUITE }}"
          echo "qe_suit branch: ${{ env.BRANCH_NAME }}"

          mvn -B -ntp test \
            $SPRING_PROFILE \
            -Dtest=${{ env.JAVA_TEST_SUITE }}

      # Il log e' cronologico: con i test in parallelo le righe di scenari diversi
      # si alternano. Qui viene prodotta una seconda copia raggruppata per caso di test,
      # leggibile senza dover filtrare a mano.
      - name: Group logs by test case
        if: always()
        run: |
          LOG_DIR="./qe_suit/interop/target/logs"
          SOURCE="$LOG_DIR/e2e.log"

          if [[ ! -f "$SOURCE" ]]; then
            echo "Nessun log da raggruppare: $SOURCE non esiste."
            exit 0
          fi

          # La chiave testCaseId occupa una colonna a larghezza fissa nel pattern di
          # logback (caratteri 32-79), quindi si estrae con substr: niente regex sul
          # testo libero del messaggio. Le righe che non rispettano il formato
          # (es. stack trace) ereditano il caso di test della riga precedente.
          awk '
            {
              if (length($0) >= 80 && substr($0, 31, 1) == "[" && substr($0, 80, 1) == "]") {
                id = substr($0, 32, 48)
                gsub(/[ \t]+$/, "", id)
                current = id
              }
              key = (current == "" ? "00-startup" : current)
              order[key] = (key in order) ? order[key] : ++seq
              lines[key] = lines[key] $0 "\n"
            }
            END {
              for (key in order) sorted[order[key]] = key
              for (i = 1; i <= seq; i++) {
                key = sorted[i]
                printf "\n========================================================================\n"
                printf "  TEST CASE: %s\n", key
                printf "========================================================================\n"
                printf "%s", lines[key]
              }
            }
          ' "$SOURCE" > "$LOG_DIR/e2e.by-test-case.log"

          echo "Casi di test trovati: $(grep -c '^  TEST CASE: ' "$LOG_DIR/e2e.by-test-case.log")"

      - name: Upload Test Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ inputs.environment || 'qa' }}-${{ github.run_number }}
          path: ./qe_suit/interop/target/logs/
          if-no-files-found: warn
          retention-days: 10

      - name: Upload Cucumber Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-report-${{ inputs.environment || 'qa' }}-${{ github.run_number }}
          path: ./qe_suit/interop/target/cucumber-reports/
          if-no-files-found: warn
          retention-days: 10